# ─────────────────────────────────────────────────────────────────────────────
# Ghost — Nginx reverse-proxy configuration
# ─────────────────────────────────────────────────────────────────────────────
# File:   nginx/ghost.conf
# Place in:  /etc/nginx/sites-available/ghost.conf
# Enable:    sudo ln -s /etc/nginx/sites-available/ghost.conf \
#                       /etc/nginx/sites-enabled/ghost.conf
#
# TLS is terminated here by Nginx.  Certbot / Let's Encrypt manages the
# certificate files; run:
#   sudo certbot --nginx -d yourdomain.com -d api.yourdomain.com
# after copying this file and replacing the domain placeholders.
# ─────────────────────────────────────────────────────────────────────────────

# ── Redirect all HTTP → HTTPS ──────────────────────────────────────────────────
server {
    listen 80;
    server_name yourdomain.com api.yourdomain.com;

    # Allow Let's Encrypt ACME challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Ghost Website (yourdomain.com → Node.js :3000) ────────────────────────────
server {
    listen 443 ssl http2;
    server_name yourdomain.com;

    # TLS certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    # Increase body size limit for file uploads / batch operations
    client_max_body_size 5m;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 90s;
    }

    # Health / status endpoints (accessible without auth)
    location ~ ^/(health|status)$ {
        proxy_pass http://127.0.0.1:3000;
    }
}

# ── Ghost API (api.yourdomain.com → Python :5056) ─────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-Frame-Options           "DENY"                                         always;
    add_header Referrer-Policy           "no-referrer"                                  always;

    client_max_body_size 2m;

    location / {
        proxy_pass         http://127.0.0.1:5056;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Health / status endpoints
    location ~ ^/(health|status)$ {
        proxy_pass http://127.0.0.1:5056;
    }
}
